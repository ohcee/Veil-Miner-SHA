name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  amd-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ocl-icd-opencl-dev opencl-headers libssl-dev
      - name: Build AMD OpenCL miner
        run: cc -O3 -Wall opencl/miner.c -o veil-miner-sha-amd -lOpenCL -lcrypto -lpthread
      - name: Package
        run: |
          mkdir -p pkg/veil-miner-sha-amd
          cp veil-miner-sha-amd opencl/veil_sha256dv.cl pkg/veil-miner-sha-amd/
          cp -r opencl/hiveos pkg/veil-miner-sha-amd/
          printf 'Veil-Miner-SHA (AMD / OpenCL)\n\nInstall an AMD OpenCL runtime first (repo: ./setup-ubuntu.sh --rocm), then:\n\n  HSA_OVERRIDE_GFX_VERSION=10.3.0 ./veil-miner-sha-amd -o stratum+tcp://veil.yadaminers.pl:3333 -u YOUR_VEIL_ADDRESS -p x\n\nThe HSA override is only needed on RDNA2 cards (e.g. RX 6600 XT).\n' > pkg/veil-miner-sha-amd/RUN.txt
          tar -C pkg -czf veil-miner-sha-amd-linux-x64.tar.gz veil-miner-sha-amd
      - name: Create release + upload AMD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="nightly"; gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          else
            TAG="$GITHUB_REF_NAME"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release create "$TAG" \
            veil-miner-sha-amd-linux-x64.tar.gz veil-miner-sha-amd opencl/veil_sha256dv.cl \
            --title "$TAG" \
            --notes "Prebuilt Veil SHA256D miners. AMD OpenCL (Linux) and NVIDIA CUDA (Linux + Windows). AMD needs an OpenCL runtime; NVIDIA needs only the NVIDIA driver." \
          || gh release upload "$TAG" \
            veil-miner-sha-amd-linux-x64.tar.gz veil-miner-sha-amd opencl/veil_sha256dv.cl --clobber

  nvidia-linux:
    needs: amd-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential automake autoconf libtool pkg-config \
            libcurl4-openssl-dev libssl-dev libjansson-dev libgmp-dev
      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.4.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'
      - name: Build ccminer
        run: |
          ./autogen.sh
          CUDA_CFLAGS="-O3 -Xcompiler -Wall -D_FORCE_INLINES" \
            ./configure CXXFLAGS="-O3 -D_REENTRANT" \
            --with-cuda="$CUDA_PATH" --with-nvml=libnvidia-ml.so
          export LIBRARY_PATH="$CUDA_PATH/lib64/stubs:$LIBRARY_PATH"
          make -j"$(nproc)"
      - name: Package (bundle libcudart so only the driver is needed)
        run: |
          mkdir -p pkg/veil-miner-sha-nvidia
          cp ccminer pkg/veil-miner-sha-nvidia/
          cp -L "$CUDA_PATH"/lib64/libcudart.so.12 pkg/veil-miner-sha-nvidia/
          printf '#!/usr/bin/env bash\ncd "$(dirname "$0")"\nexport LD_LIBRARY_PATH="$PWD:$LD_LIBRARY_PATH"\nexec ./ccminer -a sha256dv "$@"\n' > pkg/veil-miner-sha-nvidia/run.sh
          chmod +x pkg/veil-miner-sha-nvidia/run.sh
          printf 'Veil-Miner-SHA (NVIDIA / CUDA)\n\nNeeds the NVIDIA driver only (libcudart is bundled). Also install a couple of libs:\n  sudo apt install -y libcurl4 libjansson4\n\nThen run:\n  ./run.sh -o stratum+tcp://veil.yadaminers.pl:3333 -u YOUR_VEIL_ADDRESS -p x\n\n(run.sh sets LD_LIBRARY_PATH and passes -a sha256dv for you.)\n' > pkg/veil-miner-sha-nvidia/RUN.txt
          tar -C pkg -czf veil-miner-sha-nvidia-linux-x64.tar.gz veil-miner-sha-nvidia
      - name: Upload NVIDIA Linux to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG="nightly"; else TAG="$GITHUB_REF_NAME"; fi
          gh release upload "$TAG" veil-miner-sha-nvidia-linux-x64.tar.gz --clobber

  windows-nvidia:
    needs: amd-linux
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: "12.6.2"
          method: network
          sub-packages: '["nvcc", "cudart", "cuda_profiler_api", "visual_studio_integration"]'
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Build (Release x64)
        shell: cmd
        run: msbuild ccminer.sln /m /p:Configuration=Release /p:Platform=x64 /v:minimal
      - name: Confirm the exe is self contained
        shell: pwsh
        run: |
          $exe = "x64\Release\ccminer.exe"
          & dumpbin /dependents $exe
          # a stray pthread/curl/cudart DLL dependency would mean the static
          # link silently fell back, so fail loudly if one appears
          $deps = (& dumpbin /dependents $exe | Select-String "\.dll") -join "`n"
          if ($deps -match "pthread|libcurl|cudart|jansson|zlib") {
            Write-Error "unexpected runtime DLL dependency: $deps"; exit 1
          }
      - name: Package
        shell: pwsh
        run: |
          $dir = "veil-miner-sha-nvidia-windows"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "x64\Release\ccminer.exe" "$dir\ccminer.exe"
          "@echo off`r`n`"%~dp0ccminer.exe`" -a sha256dv %*" | Set-Content -NoNewline "$dir\run.bat"
          @"
          Veil-Miner-SHA (NVIDIA / CUDA) for Windows x64

          Needs the NVIDIA driver only. The CUDA runtime, curl and pthreads are
          linked statically, so this is a single self contained exe.

          Open a terminal in this folder and run:
            run.bat -o stratum+tcp://veil.yadaminers.pl:3333 -u YOUR_VEIL_ADDRESS -p x

          run.bat passes -a sha256dv for you. Or call ccminer.exe -a sha256dv directly.
          "@ | Set-Content "$dir\RUN.txt"
          Compress-Archive -Path $dir -DestinationPath "veil-miner-sha-nvidia-windows-x64.zip" -Force
      - name: Upload NVIDIA Windows to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG="nightly"; else TAG="$GITHUB_REF_NAME"; fi
          gh release upload "$TAG" veil-miner-sha-nvidia-windows-x64.zip --clobber

  checksums:
    needs: [nvidia-linux, windows-nvidia]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish SHA256SUMS.txt over every published asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG="nightly"; else TAG="$GITHUB_REF_NAME"; fi
          mkdir -p dist
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dist --clobber
          cd dist
          rm -f SHA256SUMS SHA256SUMS.txt SHA256SUMS.txt.asc
          # Sum the published copies so the file describes what users download.
          # Exclude the sum file itself: the redirect creates it before find
          # runs, so without the filter it lists its own empty hash and every
          # sha256sum -c ends with one FAILED line.
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --clobber
          gh release delete-asset "$TAG" SHA256SUMS -y 2>/dev/null || true
