name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-cuda:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential automake autoconf libtool pkg-config \
            libcurl4-openssl-dev libssl-dev libjansson-dev libgmp-dev

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        id: cuda
        with:
          cuda: '12.4.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'

      - name: nvcc version
        run: nvcc --version

      - name: autogen + configure
        run: |
          ./autogen.sh
          CUDA_CFLAGS="-O3 -Xcompiler -Wall -D_FORCE_INLINES" \
            ./configure CXXFLAGS="-O3 -D_REENTRANT" \
            --with-cuda="$CUDA_PATH" --with-nvml=libnvidia-ml.so

      - name: make
        run: |
          # libcuda.so is a driver lib; on a GPU-less runner use the toolkit stub.
          export LIBRARY_PATH="$CUDA_PATH/lib64/stubs:$LIBRARY_PATH"
          make -j"$(nproc)"

      - name: verify binary
        run: |
          test -x ./ccminer && echo "ccminer built OK"
          file ./ccminer

  opencl-amd:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCL + crypto headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ocl-icd-opencl-dev opencl-headers libssl-dev
      - name: Compile AMD OpenCL host
        run: |
          cc -O3 -Wall opencl/miner.c -o /tmp/veil-miner-sha-amd -lOpenCL -lcrypto -lpthread
          test -f opencl/veil_sha256dv.cl && echo "kernel present"
          echo "AMD OpenCL host builds"
